name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected version of all four logger packages
        required: true
        type: string
      dry_run:
        description: Validate without publishing
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify release versions
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          assert.match(process.env.EXPECTED_VERSION, /^\d+\.\d+\.\d+$/);
          for (const folder of ['core', 'browser', 'node', 'nestjs']) {
            assert.equal(require(`./libs/${folder}/package.json`).version, process.env.EXPECTED_VERSION, folder);
          }
          NODE
      - name: Install tooling and dependencies
        run: |
          npm install --global npm@11.21.0
          corepack enable
          yarn install --immutable
      - name: Lint, build and typecheck
        run: |
          yarn lint
          yarn build
          for folder in core browser node nestjs; do
            yarn exec tsc --noEmit --incremental false -p "libs/$folder/tsconfig.json"
          done
      - name: Pack and publish in dependency order
        run: |
          for package in detemiro-logger detemiro-logger-browser detemiro-logger-node detemiro-logger-nestjs; do
            archive="$RUNNER_TEMP/$package-$EXPECTED_VERSION.tgz"
            yarn workspace "$package" pack --out "$archive"
            if [[ "$DRY_RUN" == 'true' ]]; then
              npm publish "$archive" --dry-run --access public --tag latest
              continue
            fi
            export PACKAGE_NAME="$package"
            exists=$(node <<'NODE'
          (async () => {
            const url = `https://registry.npmjs.org/${process.env.PACKAGE_NAME}/${process.env.EXPECTED_VERSION}`;
            const response = await fetch(url, { headers: { 'Cache-Control': 'no-cache' } });
            if (response.status === 200) console.log('true');
            else if (response.status === 404) console.log('false');
            else throw new Error(`Registry returned HTTP ${response.status}`);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
            )
            if [[ "$exists" == 'true' ]]; then
              echo "$package@$EXPECTED_VERSION is already published; skipping"
              continue
            fi
            npm publish "$archive" --access public --tag latest --provenance
          done
